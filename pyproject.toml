[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "navaja"
version = "0.1.0"
description = "Caja de herramientas de terminal con utilidades cotidianas en castellano."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
pdf = ["pypdf[crypto]>=4.0"]
imagen = ["Pillow>=10.0", "pillow-heif>=0.16"]
qr = ["qrcode>=7.4", "Pillow>=10.0"]
documentos = ["pdf2docx>=0.5", "pymupdf>=1.24", "openpyxl>=3.1", "docx2pdf>=0.1.8; sys_platform == 'win32'"]
baja = ["yt-dlp>=2024.1"]
fondo = ["rembg[cpu]>=2.0", "Pillow>=10.0"]
todo = [
    "pypdf[crypto]>=4.0", "Pillow>=10.0", "pillow-heif>=0.16", "qrcode>=7.4",
    "pdf2docx>=0.5", "pymupdf>=1.24", "openpyxl>=3.1", "docx2pdf>=0.1.8; sys_platform == 'win32'", "yt-dlp>=2024.1",
]
dev = [
    "pytest>=8.0", "pypdf[crypto]>=4.0", "Pillow>=10.0", "pillow-heif>=0.16", "qrcode>=7.4",
    "pdf2docx>=0.5", "pymupdf>=1.24", "openpyxl>=3.1", "yt-dlp>=2024.1",
]

[project.scripts]
navaja = "navaja.app:main"
nav = "navaja.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
