[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "navaja"
version = "1.2.2"
description = "Caja de herramientas de terminal con utilidades cotidianas en castellano."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
pdf = ["pypdf[crypto]>=4.0"]
imagen = ["Pillow>=10.0", "pillow-heif>=0.16"]
qr = ["qrcode>=7.4", "Pillow>=10.0"]
documentos = ["pdf2docx>=0.5", "pymupdf>=1.24", "openpyxl>=3.1", "docx2pdf>=0.1.8; sys_platform == 'win32'"]
baja = ["yt-dlp>=2024.1"]
fondo = ["rembg[cpu]>=2.0", "Pillow>=10.0"]
falsos = ["Faker>=24.0"]
sistema = ["psutil>=5.9"]
todo = [
    "pypdf[crypto]>=4.0", "Pillow>=10.0", "pillow-heif>=0.16", "qrcode>=7.4",
    "pdf2docx>=0.5", "pymupdf>=1.24", "openpyxl>=3.1", "docx2pdf>=0.1.8; sys_platform == 'win32'", "yt-dlp>=2024.1",
    "Faker>=24.0", "psutil>=5.9",
]
dev = [
    "pytest>=8.0", "pypdf[crypto]>=4.0", "Pillow>=10.0", "pillow-heif>=0.16", "qrcode>=7.4",
    "pdf2docx>=0.5", "pymupdf>=1.24", "openpyxl>=3.1", "yt-dlp>=2024.1", "Faker>=24.0",
    "psutil>=5.9",
]

[project.scripts]
navaja = "navaja.app:main"
nav = "navaja.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
navaja = ["chuletas/*.md", "ejemplo-acciones.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Solo lo que es un fallo de verdad o código muerto: nombres sin definir, imports y
# variables sin usar, errores de sintaxis. El estilo (largo de línea, comillas…) no se
# revisa: el código ya sigue uno y cambiarlo todo no aporta nada.
select = ["F", "E9", "PLE"]

[tool.ruff.lint.per-file-ignores]
# pytest pasa los fixtures importados (git_aislado) como parámetro: no es redefinir nada
"tests/*" = ["F811"]
