# Pasa ruff (el linter) y los tests de navaja en Linux, Windows y macOS en cada push y PR.
# Así se ve en GitHub (pestaña Actions y la marca verde de cada commit) que sigue funcionando
# en los tres sistemas, no solo en mi PC.
name: Tests

on:
  push:
  pull_request:

jobs:
  ruff:
    name: ruff (linter)
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el código
        uses: actions/checkout@v5

      - name: Instalar uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Buscar fallos con ruff (la configuración está en pyproject.toml)
        run: uvx ruff@0.17.6 check src tests

  pytest:
    name: pytest en ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # si falla en uno, que acaben los otros: así se ve si es cosa de un sistema
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Bajar el código
        uses: actions/checkout@v5

      - name: Instalar uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Instalar Python 3.12 y las dependencias (las de uv.lock, con las de pruebas)
        run: uv sync --frozen --extra dev

      - name: Que todo compile
        run: uv run python -m compileall -q src tests

      - name: Tests
        run: uv run pytest
        env:
          PYTHONUTF8: "1"  # en Windows, la salida en UTF-8 como en Windows Terminal

      - name: navaja se arranca
        run: uv run navaja --help

  instalador:
    # El instalador de una línea, de verdad: en una máquina sin navaja, instala uv (si no
    # está) y navaja desde el .zip de este mismo commit (NAVAJA_ORIGEN), como haría el
    # profesor con la versión publicada. En Windows, con PowerShell 5.1, el que trae Windows.
    name: instalador en ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      NAVAJA_ORIGEN: ${{ github.server_url }}/${{ github.repository }}/archive/${{ github.event.pull_request.head.sha || github.sha }}.zip

    steps:
      - name: Bajar el código (solo para tener los instaladores)
        uses: actions/checkout@v5

      - name: Instalar con instalar.sh
        if: runner.os != 'Windows'
        run: |
          sh instalar.sh
          "$HOME/.local/bin/navaja" --version
          "$HOME/.local/bin/navaja" --help > /dev/null

      - name: Instalar con instalar.ps1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Get-Content instalar.ps1 -Raw -Encoding UTF8 | Invoke-Expression
          navaja --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          navaja --help > $null
          if ($LASTEXITCODE -ne 0) { exit 1 }
